# Deploy Tracker REVO para Google Cloud Run
# Mesmo fluxo do ipmet: push no GitHub dispara deploy automático

name: Deploy Tracker REVO

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: codigos-465200
  REGION: southamerica-east1
  SERVICE_NAME: trackerrevo

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
        # Se usar Workload Identity (como ipmet): use workload_identity_provider e service_account

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build Docker image
        run: |
          gcloud builds submit --tag gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }} ./trackerrevo --project=${{ env.PROJECT_ID }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --timeout 120 \
            --allow-unauthenticated \
            --set-env-vars TZ=America/Sao_Paulo,PYTHONUNBUFFERED=1,GCS_BUCKET=trackerrevo-cache \
            --project ${{ env.PROJECT_ID }}

      - name: Output URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }} --format 'value(status.url)')
          echo "=========================================="
          echo "Tracker REVO deployed!"
          echo "URL: $URL"
          echo ""
          echo ""
          echo "Teste estes links:"
          echo "  Health:   $URL/health"
          echo "  Radar:    $URL/radar"
          echo "  Historico: $URL/historico"
          echo "=========================================="
