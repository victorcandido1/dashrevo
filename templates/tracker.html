<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar de Aeronaves - São Paulo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e17;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
        }

        /* Top Bar */
        #topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 48px;
            background: rgba(10, 14, 23, 0.95);
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        #topbar .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #topbar .title {
            font-size: 16px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }

        #topbar .stats {
            font-size: 12px;
            color: #64748b;
        }

        #topbar .stats span {
            color: #38bdf8;
            font-weight: 600;
        }

        #topbar .right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .btn:hover { background: #334155; color: #e2e8f0; }
        .btn.active { background: #0ea5e9; color: white; border-color: #0ea5e9; }
        .btn.alert { background: #dc2626; border-color: #dc2626; color: white; animation: pulse-btn 1.5s infinite; }

        @keyframes pulse-btn {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.online { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
        .status-dot.offline { background: #ef4444; }
        .status-dot.loading { background: #f59e0b; animation: blink 1s infinite; }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Map */
        #map {
            position: fixed;
            top: 48px; left: 0; right: 0; bottom: 0;
            z-index: 1;
        }

        /* Tracked Aircraft Panel */
        #tracked-panel {
            position: fixed;
            top: 60px; left: 12px;
            width: 260px;
            background: rgba(10, 14, 23, 0.92);
            border: 1px solid #1e293b;
            border-radius: 10px;
            z-index: 900;
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        #tracked-panel .panel-header {
            background: rgba(30, 41, 59, 0.8);
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 600;
            color: #38bdf8;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tracked-item {
            padding: 10px 14px;
            border-bottom: 1px solid rgba(30, 41, 59, 0.5);
            cursor: pointer;
            transition: background 0.2s;
        }

        .tracked-item:hover { background: rgba(30, 41, 59, 0.6); }
        .tracked-item:last-child { border-bottom: none; }

        .tracked-item .reg {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .tracked-item .reg.detected { color: #22c55e; }
        .tracked-item .reg.no-signal { color: #64748b; }

        .tracked-item .status {
            font-size: 11px;
            margin-top: 3px;
        }

        .tracked-item .status.em-voo { color: #38bdf8; }
        .tracked-item .status.no-solo { color: #f59e0b; }
        .tracked-item .status.sem-sinal { color: #64748b; }
        .tracked-item .status.sinal-perdido { color: #ef4444; }

        .tracked-item .details {
            font-size: 10px;
            color: #64748b;
            margin-top: 2px;
        }

        /* Events Panel */
        #events-panel {
            position: fixed;
            bottom: 12px; left: 12px;
            width: 340px;
            max-height: 250px;
            background: rgba(10, 14, 23, 0.92);
            border: 1px solid #1e293b;
            border-radius: 10px;
            z-index: 900;
            backdrop-filter: blur(10px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #events-panel .panel-header {
            background: rgba(30, 41, 59, 0.8);
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            color: #f59e0b;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        #events-list {
            overflow-y: auto;
            flex: 1;
            padding: 4px 0;
        }

        .event-item {
            padding: 6px 14px;
            font-size: 12px;
            border-bottom: 1px solid rgba(30, 41, 59, 0.3);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .event-item .event-time {
            color: #64748b;
            font-size: 10px;
        }

        .event-item.takeoff { border-left: 3px solid #22c55e; }
        .event-item.landing { border-left: 3px solid #3b82f6; }
        .event-item.detected { border-left: 3px solid #f59e0b; }
        .event-item.lost_signal { border-left: 3px solid #ef4444; }

        .event-item .event-msg {
            color: #e2e8f0;
            font-weight: 500;
        }

        .no-events {
            padding: 16px;
            text-align: center;
            color: #475569;
            font-size: 12px;
        }

        /* Notification Popup */
        #notification-popup {
            position: fixed;
            top: 60px; right: 12px;
            z-index: 1100;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .notif {
            background: rgba(10, 14, 23, 0.95);
            border: 2px solid #f59e0b;
            border-radius: 10px;
            padding: 14px 18px;
            min-width: 280px;
            animation: notifIn 0.4s ease, notifOut 0.4s ease 5s forwards;
            pointer-events: auto;
            backdrop-filter: blur(10px);
        }

        .notif.takeoff { border-color: #22c55e; }
        .notif.landing { border-color: #3b82f6; }
        .notif.detected { border-color: #f59e0b; }

        .notif .notif-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .notif.takeoff .notif-title { color: #22c55e; }
        .notif.landing .notif-title { color: #3b82f6; }
        .notif.detected .notif-title { color: #f59e0b; }

        .notif .notif-body {
            font-size: 12px;
            color: #94a3b8;
        }

        @keyframes notifIn {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes notifOut {
            from { opacity: 1; }
            to { opacity: 0; transform: translateY(-20px); }
        }

        /* Aircraft markers */
        .aircraft-icon {
            transition: transform 0.5s ease;
        }

        .aircraft-icon svg {
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
        }

        /* Leaflet popup styling */
        .leaflet-popup-content-wrapper {
            background: rgba(15, 23, 42, 0.95) !important;
            color: #e2e8f0 !important;
            border: 1px solid #334155 !important;
            border-radius: 8px !important;
            backdrop-filter: blur(10px);
        }

        .leaflet-popup-tip {
            background: rgba(15, 23, 42, 0.95) !important;
            border: 1px solid #334155 !important;
        }

        .leaflet-popup-content {
            margin: 10px 14px !important;
            font-size: 12px !important;
            line-height: 1.6 !important;
        }

        .popup-reg {
            font-size: 16px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 1px;
        }

        .popup-tracked {
            color: #22c55e;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .popup-field {
            color: #94a3b8;
        }

        .popup-value {
            color: #e2e8f0;
            font-weight: 500;
        }

        /* Airport markers */
        .airport-label {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 10px;
            font-weight: 600;
            color: #94a3b8;
            white-space: nowrap;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

        /* Back to dashboard link */
        .back-link {
            color: #64748b;
            text-decoration: none;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .back-link:hover { color: #94a3b8; }

        /* Mobile adjustments */
        @media (max-width: 640px) {
            #tracked-panel { width: 200px; }
            #events-panel { width: calc(100% - 24px); max-height: 180px; }
        }
    </style>
</head>
<body>

<!-- Top Bar -->
<div id="topbar">
    <div class="left">
        <a href="/" class="back-link">&larr; Dashboard</a>
        <div class="title">RADAR AO VIVO</div>
        <div class="stats">
            <span class="status-dot loading" id="status-dot"></span>
            <span id="aircraft-count">0</span> aeronaves |
            Atualizado: <span id="last-update">--:--:--</span>
        </div>
    </div>
    <div class="right">
        <button class="btn active" id="btn-sound" onclick="toggleSound()">
            &#x1F50A; Som
        </button>
        <button class="btn" id="btn-notif" onclick="requestNotifications()">
            Notificações
        </button>
        <button class="btn" onclick="refreshNow()">
            &#x21BB; Atualizar
        </button>
    </div>
</div>

<!-- Map -->
<div id="map"></div>

<!-- Tracked Aircraft Panel -->
<div id="tracked-panel">
    <div class="panel-header">
        &#x1F4E1; AERONAVES RASTREADAS
    </div>
    <div id="tracked-list">
        <div class="tracked-item">
            <div class="reg no-signal">PR-OMB</div>
            <div class="status sem-sinal">Aguardando dados...</div>
        </div>
        <div class="tracked-item">
            <div class="reg no-signal">PR-OMH</div>
            <div class="status sem-sinal">Aguardando dados...</div>
        </div>
        <div class="tracked-item">
            <div class="reg no-signal">PR-OOE</div>
            <div class="status sem-sinal">Aguardando dados...</div>
        </div>
    </div>
</div>

<!-- Events Panel -->
<div id="events-panel">
    <div class="panel-header">
        &#x26A0; EVENTOS
    </div>
    <div id="events-list">
        <div class="no-events">Aguardando eventos de aeronaves rastreadas...</div>
    </div>
</div>

<!-- Notification Popup Container -->
<div id="notification-popup"></div>

<script>
// ===== Configuration =====
let CONFIG = {
    bounds: { lamin: -25.0, lamax: -21.5, lomin: -48.5, lomax: -43.0 },
    tracked_registrations: ['PR-OMB', 'PR-OMH', 'PR-OOE'],
    airports: [],
    refresh_interval: 15,
    center: { lat: -23.55, lon: -46.63 }
};

let map;
let aircraftMarkers = {};  // icao24 -> marker
let airportMarkers = [];
let boundsRect;
let soundEnabled = true;
let refreshTimer = null;
let eventsList = [];
let isLoading = false;

// ===== Audio Context for Alerts =====
let audioCtx = null;

function getAudioContext() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
}

function playAlertSound(type) {
    if (!soundEnabled) return;
    try {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') ctx.resume();

        if (type === 'detected') {
            // Three rising beeps
            [0, 0.2, 0.4].forEach((delay, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 600 + (i * 200);
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.3, ctx.currentTime + delay);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + delay + 0.15);
                osc.start(ctx.currentTime + delay);
                osc.stop(ctx.currentTime + delay + 0.15);
            });
        } else if (type === 'takeoff') {
            // Rising sweep
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(400, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.5);
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.6);
        } else if (type === 'landing') {
            // Descending sweep
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(1000, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.5);
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.6);
        }
    } catch (e) {
        console.warn('Audio error:', e);
    }
}

// ===== Initialize Map =====
function initMap() {
    map = L.map('map', {
        center: [CONFIG.center.lat, CONFIG.center.lon],
        zoom: 8,
        zoomControl: true,
        attributionControl: true
    });

    // Dark map tiles
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 19
    }).addTo(map);

    // Region bounds rectangle
    boundsRect = L.rectangle(
        [[CONFIG.bounds.lamin, CONFIG.bounds.lomin], [CONFIG.bounds.lamax, CONFIG.bounds.lomax]],
        { color: '#38bdf8', weight: 1, opacity: 0.3, fill: false, dashArray: '5, 5' }
    ).addTo(map);
}

function addAirports(airports) {
    airports.forEach(apt => {
        const marker = L.marker([apt.lat, apt.lon], {
            icon: L.divIcon({
                className: 'airport-marker',
                html: `<div class="airport-label">${apt.icao}</div>`,
                iconSize: [50, 16],
                iconAnchor: [25, 8]
            }),
            zIndexOffset: -100
        }).addTo(map);
        marker.bindPopup(`<b>${apt.icao}</b><br>${apt.name}`);
        airportMarkers.push(marker);
    });
}

// ===== Aircraft SVG Icon =====
function createAircraftSvg(heading, isTracked, onGround) {
    const rotation = heading != null ? heading : 0;
    let color;
    if (isTracked) {
        color = onGround ? '#f59e0b' : '#22c55e';
    } else {
        color = onGround ? '#475569' : '#64748b';
    }
    const size = isTracked ? 28 : 18;
    const opacity = isTracked ? 1.0 : 0.7;

    return L.divIcon({
        className: 'aircraft-icon',
        html: `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="transform: rotate(${rotation}deg); opacity: ${opacity};">
            <path d="M12 2 L10 9 L3 12 L10 13 L10 20 L8 22 L12 21 L16 22 L14 20 L14 13 L21 12 L14 9 Z"
                  fill="${color}" stroke="${isTracked ? '#fff' : 'none'}" stroke-width="${isTracked ? 1 : 0}"/>
        </svg>`,
        iconSize: [size, size],
        iconAnchor: [size/2, size/2]
    });
}

// ===== Update Aircraft on Map =====
function updateAircraft(aircraftList) {
    const currentIcaos = new Set();

    aircraftList.forEach(ac => {
        if (!ac.latitude || !ac.longitude) return;
        currentIcaos.add(ac.icao24);

        const icon = createAircraftSvg(ac.heading, ac.is_tracked, ac.on_ground);

        if (aircraftMarkers[ac.icao24]) {
            // Update existing marker
            aircraftMarkers[ac.icao24].setLatLng([ac.latitude, ac.longitude]);
            aircraftMarkers[ac.icao24].setIcon(icon);
            aircraftMarkers[ac.icao24].setZIndexOffset(ac.is_tracked ? 1000 : 0);
        } else {
            // Create new marker
            const marker = L.marker([ac.latitude, ac.longitude], {
                icon: icon,
                zIndexOffset: ac.is_tracked ? 1000 : 0
            }).addTo(map);
            aircraftMarkers[ac.icao24] = marker;
        }

        // Update popup content
        const popupContent = buildPopup(ac);
        aircraftMarkers[ac.icao24].bindPopup(popupContent);
    });

    // Remove markers for aircraft no longer in data
    Object.keys(aircraftMarkers).forEach(icao24 => {
        if (!currentIcaos.has(icao24)) {
            map.removeLayer(aircraftMarkers[icao24]);
            delete aircraftMarkers[icao24];
        }
    });
}

function buildPopup(ac) {
    const tracked = ac.is_tracked ? `<div class="popup-tracked">RASTREADO</div>` : '';
    const reg = ac.registration || ac.callsign || ac.icao24;
    const alt = ac.altitude_ft != null ? `${ac.altitude_ft.toLocaleString()} ft` : '-';
    const spd = ac.velocity_kt != null ? `${ac.velocity_kt} kt` : '-';
    const vr = ac.vertical_rate != null ? `${ac.vertical_rate > 0 ? '+' : ''}${Math.round(ac.vertical_rate * 196.85)} ft/min` : '-';
    const hdg = ac.heading != null ? `${Math.round(ac.heading)}°` : '-';
    const status = ac.on_ground ? '<span style="color:#f59e0b">No solo</span>' : '<span style="color:#22c55e">Em voo</span>';

    return `
        <div class="popup-reg">${reg}</div>
        ${tracked}
        <div style="margin-top:6px;">
            <span class="popup-field">ICAO24:</span> <span class="popup-value">${ac.icao24}</span><br>
            <span class="popup-field">Callsign:</span> <span class="popup-value">${ac.callsign || '-'}</span><br>
            <span class="popup-field">Status:</span> ${status}<br>
            <span class="popup-field">Altitude:</span> <span class="popup-value">${alt}</span><br>
            <span class="popup-field">Velocidade:</span> <span class="popup-value">${spd}</span><br>
            <span class="popup-field">Proa:</span> <span class="popup-value">${hdg}</span><br>
            <span class="popup-field">Razão Vertical:</span> <span class="popup-value">${vr}</span><br>
            <span class="popup-field">País:</span> <span class="popup-value">${ac.origin_country || '-'}</span>
        </div>
    `;
}

// ===== Tracked Aircraft Panel =====
function updateTrackedPanel(trackedData) {
    const container = document.getElementById('tracked-list');
    if (!trackedData) return;

    let html = '';
    CONFIG.tracked_registrations.forEach(reg => {
        const info = trackedData[reg] || { status: 'sem sinal', details: null };
        const statusClass = info.status.replace(' ', '-').replace('á', 'a');
        const regClass = info.status === 'sem sinal' ? 'no-signal' : 'detected';

        let detailsHtml = '';
        if (info.details) {
            const parts = [];
            if (info.details.altitude_ft != null) parts.push(`ALT: ${info.details.altitude_ft.toLocaleString()} ft`);
            if (info.details.velocity_kt != null) parts.push(`VEL: ${info.details.velocity_kt} kt`);
            if (info.details.heading != null) parts.push(`HDG: ${Math.round(info.details.heading)}°`);
            detailsHtml = `<div class="details">${parts.join(' | ')}</div>`;
        }

        const onclick = info.details ? `onclick="flyToAircraft(${info.details.lat}, ${info.details.lon})"` : '';

        html += `
            <div class="tracked-item" ${onclick}>
                <div class="reg ${regClass}">${reg}</div>
                <div class="status ${statusClass}">${info.status.toUpperCase()}</div>
                ${detailsHtml}
            </div>
        `;
    });
    container.innerHTML = html;
}

function flyToAircraft(lat, lon) {
    if (lat && lon) {
        map.flyTo([lat, lon], 12, { duration: 1 });
    }
}

// ===== Events Panel =====
function addEvents(newEvents) {
    if (!newEvents || newEvents.length === 0) return;

    newEvents.forEach(evt => {
        eventsList.unshift(evt);

        // Play sound
        playAlertSound(evt.type);

        // Show popup notification
        showPopupNotification(evt);

        // Browser notification
        sendBrowserNotification(evt);
    });

    // Keep last 50 events
    eventsList = eventsList.slice(0, 50);
    renderEvents();
}

function renderEvents() {
    const container = document.getElementById('events-list');
    if (eventsList.length === 0) {
        container.innerHTML = '<div class="no-events">Aguardando eventos de aeronaves rastreadas...</div>';
        return;
    }

    let html = '';
    eventsList.forEach(evt => {
        const time = evt.time ? new Date(evt.time).toLocaleTimeString('pt-BR') : '--:--';
        const typeLabels = {
            'takeoff': 'DECOLAGEM',
            'landing': 'POUSO',
            'detected': 'DETECTADO',
            'lost_signal': 'SINAL PERDIDO'
        };
        html += `
            <div class="event-item ${evt.type}">
                <div class="event-msg">${typeLabels[evt.type] || evt.type} - ${evt.registration || ''}</div>
                <div class="event-time">${time} - ${evt.message || ''}</div>
            </div>
        `;
    });
    container.innerHTML = html;
}

// ===== Popup Notifications =====
function showPopupNotification(evt) {
    const container = document.getElementById('notification-popup');
    const typeLabels = {
        'takeoff': 'DECOLAGEM',
        'landing': 'POUSO',
        'detected': 'DETECTADO',
        'lost_signal': 'SINAL PERDIDO'
    };

    const div = document.createElement('div');
    div.className = `notif ${evt.type}`;
    div.innerHTML = `
        <div class="notif-title">${typeLabels[evt.type] || evt.type}</div>
        <div class="notif-body">${evt.message || evt.registration}</div>
    `;
    container.appendChild(div);

    // Remove after animation
    setTimeout(() => {
        if (div.parentNode) div.parentNode.removeChild(div);
    }, 5500);
}

// ===== Browser Notifications =====
function requestNotifications() {
    if ('Notification' in window) {
        Notification.requestPermission().then(perm => {
            const btn = document.getElementById('btn-notif');
            if (perm === 'granted') {
                btn.classList.add('active');
                btn.textContent = 'Notificações ON';
            } else {
                btn.textContent = 'Bloqueado';
            }
        });
    }
}

function sendBrowserNotification(evt) {
    if ('Notification' in window && Notification.permission === 'granted') {
        const typeLabels = {
            'takeoff': 'DECOLAGEM',
            'landing': 'POUSO',
            'detected': 'DETECTADO',
            'lost_signal': 'SINAL PERDIDO'
        };
        new Notification(`${typeLabels[evt.type]} - ${evt.registration || ''}`, {
            body: evt.message || '',
            icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><text y="20" font-size="20">✈️</text></svg>',
            tag: `tracker-${evt.type}-${evt.registration}`,
            requireInteraction: false
        });
    }
}

// ===== Sound Toggle =====
function toggleSound() {
    soundEnabled = !soundEnabled;
    const btn = document.getElementById('btn-sound');
    if (soundEnabled) {
        btn.classList.add('active');
        btn.innerHTML = '&#x1F50A; Som';
        // Initialize audio context on user interaction
        getAudioContext();
    } else {
        btn.classList.remove('active');
        btn.innerHTML = '&#x1F507; Mudo';
    }
}

// ===== Data Fetching =====
async function fetchAircraft() {
    if (isLoading) return;
    isLoading = true;

    const dot = document.getElementById('status-dot');
    dot.className = 'status-dot loading';

    try {
        const response = await fetch('/api/tracker/aircraft');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();

        if (data.error) {
            console.warn('API warning:', data.error);
            dot.className = 'status-dot offline';
        } else {
            dot.className = 'status-dot online';
        }

        // Update aircraft count
        document.getElementById('aircraft-count').textContent = data.total || 0;

        // Update time
        const now = new Date();
        document.getElementById('last-update').textContent = now.toLocaleTimeString('pt-BR');

        // Update map markers
        if (data.aircraft) {
            updateAircraft(data.aircraft);
        }

        // Update tracked panel
        if (data.tracked_aircraft) {
            updateTrackedPanel(data.tracked_aircraft);
        }

        // Process events
        if (data.tracked_events && data.tracked_events.length > 0) {
            addEvents(data.tracked_events);
        }

    } catch (err) {
        console.error('Fetch error:', err);
        document.getElementById('status-dot').className = 'status-dot offline';
    } finally {
        isLoading = false;
    }
}

async function loadConfig() {
    try {
        const response = await fetch('/api/tracker/config');
        const data = await response.json();
        if (data.bounds) CONFIG.bounds = data.bounds;
        if (data.center) CONFIG.center = data.center;
        if (data.tracked_registrations) CONFIG.tracked_registrations = data.tracked_registrations;
        if (data.airports) CONFIG.airports = data.airports;
        if (data.refresh_interval) CONFIG.refresh_interval = data.refresh_interval;
    } catch (e) {
        console.warn('Could not load config, using defaults');
    }
}

function refreshNow() {
    // Reset timer and fetch immediately
    if (refreshTimer) clearInterval(refreshTimer);
    fetchAircraft();
    refreshTimer = setInterval(fetchAircraft, CONFIG.refresh_interval * 1000);
}

// ===== Initialization =====
async function init() {
    await loadConfig();
    initMap();

    if (CONFIG.airports && CONFIG.airports.length > 0) {
        addAirports(CONFIG.airports);
    }

    // Update bounds rectangle with config
    if (boundsRect) {
        boundsRect.setBounds([
            [CONFIG.bounds.lamin, CONFIG.bounds.lomin],
            [CONFIG.bounds.lamax, CONFIG.bounds.lomax]
        ]);
    }

    // Start fetching
    await fetchAircraft();
    refreshTimer = setInterval(fetchAircraft, CONFIG.refresh_interval * 1000);

    // Check notification permission status
    if ('Notification' in window && Notification.permission === 'granted') {
        const btn = document.getElementById('btn-notif');
        btn.classList.add('active');
        btn.textContent = 'Notificações ON';
    }
}

// Start the app
document.addEventListener('DOMContentLoaded', init);
</script>
