<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar de Aeronaves - Sao Paulo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet.css') }}" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e17;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Loading screen */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0a0e17;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        #loading-screen .loader-text {
            color: #38bdf8;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        #loading-screen .loader-sub {
            color: #64748b;
            font-size: 13px;
        }

        #loading-screen .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #1e293b;
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #error-msg {
            color: #ef4444;
            font-size: 13px;
            margin-top: 16px;
            max-width: 400px;
            text-align: center;
            display: none;
        }

        /* Top Bar */
        #topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 48px;
            background: rgba(10, 14, 23, 0.95);
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
        }

        #topbar .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #topbar .title {
            font-size: 16px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }

        #topbar .stats {
            font-size: 12px;
            color: #64748b;
        }

        #topbar .stats span {
            color: #38bdf8;
            font-weight: 600;
        }

        #topbar .right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .btn:hover { background: #334155; color: #e2e8f0; }
        .btn.active { background: #0ea5e9; color: white; border-color: #0ea5e9; }

        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.online { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
        .status-dot.offline { background: #ef4444; }
        .status-dot.loading { background: #f59e0b; animation: blink 1s infinite; }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Map */
        #map {
            position: fixed;
            top: 48px; left: 0; right: 0; bottom: 0;
            z-index: 1;
            background: #0a0e17;
        }

        /* Tracked Aircraft Panel */
        #tracked-panel {
            position: fixed;
            top: 60px; left: 12px;
            width: 260px;
            background: rgba(10, 14, 23, 0.92);
            border: 1px solid #1e293b;
            border-radius: 10px;
            z-index: 900;
            overflow: hidden;
        }

        #tracked-panel .panel-header {
            background: rgba(30, 41, 59, 0.8);
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 600;
            color: #38bdf8;
            border-bottom: 1px solid #1e293b;
        }

        .tracked-item {
            padding: 10px 14px;
            border-bottom: 1px solid rgba(30, 41, 59, 0.5);
            cursor: pointer;
            transition: background 0.2s;
        }

        .tracked-item:hover { background: rgba(30, 41, 59, 0.6); }
        .tracked-item:last-child { border-bottom: none; }

        .tracked-item .reg {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .tracked-item .reg.detected { color: #22c55e; }
        .tracked-item .reg.no-signal { color: #64748b; }

        .tracked-item .info {
            font-size: 11px;
            margin-top: 3px;
        }

        .tracked-item .info.em-voo { color: #38bdf8; }
        .tracked-item .info.no-solo { color: #f59e0b; }
        .tracked-item .info.sem-sinal { color: #64748b; }
        .tracked-item .info.sinal-perdido { color: #ef4444; }

        .tracked-item .details {
            font-size: 10px;
            color: #64748b;
            margin-top: 2px;
        }

        /* Events Panel */
        #events-panel {
            position: fixed;
            bottom: 12px; left: 12px;
            width: 340px;
            max-height: 250px;
            background: rgba(10, 14, 23, 0.92);
            border: 1px solid #1e293b;
            border-radius: 10px;
            z-index: 900;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #events-panel .panel-header {
            background: rgba(30, 41, 59, 0.8);
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            color: #f59e0b;
            border-bottom: 1px solid #1e293b;
            flex-shrink: 0;
        }

        #events-list {
            overflow-y: auto;
            flex: 1;
            padding: 4px 0;
        }

        .event-item {
            padding: 6px 14px;
            font-size: 12px;
            border-bottom: 1px solid rgba(30, 41, 59, 0.3);
        }

        .event-item .event-time {
            color: #64748b;
            font-size: 10px;
        }

        .event-item.takeoff { border-left: 3px solid #22c55e; }
        .event-item.landing { border-left: 3px solid #3b82f6; }
        .event-item.detected { border-left: 3px solid #f59e0b; }
        .event-item.lost_signal { border-left: 3px solid #ef4444; }

        .event-item .event-msg {
            color: #e2e8f0;
            font-weight: 500;
        }

        .event-item.has-route {
            cursor: pointer;
        }
        .event-item.has-route:hover {
            background: rgba(56, 189, 248, 0.15);
        }
        .event-item .hint-route {
            font-size: 9px;
            color: #38bdf8;
            margin-top: 2px;
        }

        .no-events {
            padding: 16px;
            text-align: center;
            color: #475569;
            font-size: 12px;
        }

        /* Notification Popup */
        #notification-popup {
            position: fixed;
            top: 60px; right: 12px;
            z-index: 1100;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .notif {
            background: rgba(10, 14, 23, 0.95);
            border: 2px solid #f59e0b;
            border-radius: 10px;
            padding: 14px 18px;
            min-width: 280px;
            animation: notifIn 0.4s ease;
            pointer-events: auto;
        }

        .notif.takeoff { border-color: #22c55e; }
        .notif.landing { border-color: #3b82f6; }
        .notif.detected { border-color: #f59e0b; }

        .notif .notif-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .notif.takeoff .notif-title { color: #22c55e; }
        .notif.landing .notif-title { color: #3b82f6; }
        .notif.detected .notif-title { color: #f59e0b; }

        .notif .notif-body {
            font-size: 12px;
            color: #94a3b8;
        }

        @keyframes notifIn {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Leaflet overrides */
        .leaflet-popup-content-wrapper {
            background: rgba(15, 23, 42, 0.95) !important;
            color: #e2e8f0 !important;
            border: 1px solid #334155 !important;
            border-radius: 8px !important;
        }

        .leaflet-popup-tip {
            background: rgba(15, 23, 42, 0.95) !important;
        }

        .leaflet-popup-content {
            margin: 10px 14px !important;
            font-size: 12px !important;
            line-height: 1.6 !important;
        }

        .popup-reg {
            font-size: 16px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 1px;
        }

        .popup-tracked {
            color: #22c55e;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .popup-field { color: #94a3b8; }
        .popup-value { color: #e2e8f0; font-weight: 500; }
        .popup-more { color: #38bdf8; font-size: 11px; text-decoration: none; }
        .popup-more:hover { text-decoration: underline; }

        .airport-label {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 10px;
            font-weight: 600;
            color: #94a3b8;
            white-space: nowrap;
        }

        .back-link {
            color: #64748b;
            text-decoration: none;
            font-size: 12px;
        }
        .back-link:hover { color: #94a3b8; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

        @media (max-width: 640px) {
            #tracked-panel { width: 200px; }
            #events-panel { width: calc(100% - 24px); max-height: 180px; }
        }
    </style>
</head>
<body>

<!-- Loading Screen -->
<div id="loading-screen">
    <div class="spinner"></div>
    <div class="loader-text">RADAR DE AERONAVES</div>
    <div class="loader-sub" id="loading-status">Carregando mapa...</div>
    <div id="error-msg"></div>
</div>

<!-- Top Bar -->
<div id="topbar">
    <div class="left">
        <a href="/" class="back-link">&larr; Início</a>
        <div class="title">RADAR AO VIVO</div>
        <div class="stats">
            <span class="status-dot loading" id="status-dot"></span>
            <span id="aircraft-count">0</span> aeronaves |
            Atualizado: <span id="last-update">--:--:--</span>
        </div>
    </div>
    <div class="right">
        <button class="btn" onclick="location.href='/historico'">Histórico</button>
        <button class="btn active" id="btn-sound" onclick="toggleSound()">Som ON</button>
        <button class="btn" id="btn-notif" onclick="requestNotifications()">Notif.</button>
        <button class="btn" onclick="refreshNow()">Atualizar</button>
    </div>
</div>

<!-- Map -->
<div id="map"></div>

<!-- Tracked Aircraft Panel -->
<div id="tracked-panel">
    <div class="panel-header">AERONAVES RASTREADAS</div>
    <div id="tracked-list">
        <div class="tracked-item">
            <div class="reg no-signal">PR-OMB</div>
            <div class="info sem-sinal">Aguardando dados...</div>
        </div>
        <div class="tracked-item">
            <div class="reg no-signal">PR-OMH</div>
            <div class="info sem-sinal">Aguardando dados...</div>
        </div>
        <div class="tracked-item">
            <div class="reg no-signal">PR-OOE</div>
            <div class="info sem-sinal">Aguardando dados...</div>
        </div>
    </div>
</div>

<!-- Events Panel -->
<div id="events-panel">
    <div class="panel-header">EVENTOS E HISTÓRICO</div>
    <div id="events-list">
        <div class="no-events">Aguardando eventos de aeronaves rastreadas...</div>
    </div>
</div>

<!-- Notification Popup Container -->
<div id="notification-popup"></div>

<!-- Load Leaflet at end of body -->
<script src="{{ url_for('static', filename='vendor/leaflet.js') }}"></script>

<script>
(function() {
    'use strict';

    // ===== Configuration =====
    var CONFIG = {
        bounds: { lamin: -25.0, lamax: -21.5, lomin: -48.5, lomax: -43.0 },
        tracked_registrations: ['PR-OMB', 'PR-OMH', 'PR-OOE'],
        airports: [],
        refresh_interval: 1,
        center: { lat: -23.55, lon: -46.63 }
    };

    var map = null;
    var aircraftMarkers = {};
    var airportMarkers = [];
    var boundsRect = null;
    var routeLayer = null;
    var soundEnabled = true;
    var refreshTimer = null;
    var eventsList = [];
    var flightHistoryList = [];
    var isLoading = false;
    var audioCtx = null;

    // ===== Loading Screen =====
    function hideLoading() {
        var el = document.getElementById('loading-screen');
        if (el) el.style.display = 'none';
    }

    function showError(msg) {
        var el = document.getElementById('error-msg');
        if (el) {
            el.textContent = msg;
            el.style.display = 'block';
        }
        var sub = document.getElementById('loading-status');
        if (sub) sub.textContent = 'Erro ao carregar';
    }

    // ===== Audio =====
    function getAudioCtx() {
        if (!audioCtx) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch(e) {
                // Audio not available
            }
        }
        return audioCtx;
    }

    function playAlertSound(type) {
        if (!soundEnabled) return;
        var ctx = getAudioCtx();
        if (!ctx) return;
        try {
            if (ctx.state === 'suspended') ctx.resume();

            if (type === 'detected') {
                [0, 0.2, 0.4].forEach(function(delay, i) {
                    var osc = ctx.createOscillator();
                    var gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = 600 + (i * 200);
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.3, ctx.currentTime + delay);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + delay + 0.15);
                    osc.start(ctx.currentTime + delay);
                    osc.stop(ctx.currentTime + delay + 0.15);
                });
            } else if (type === 'takeoff') {
                var osc = ctx.createOscillator();
                var gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.5);
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.6);
            } else if (type === 'landing') {
                var osc2 = ctx.createOscillator();
                var gain2 = ctx.createGain();
                osc2.connect(gain2);
                gain2.connect(ctx.destination);
                osc2.frequency.setValueAtTime(1000, ctx.currentTime);
                osc2.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.5);
                osc2.type = 'sine';
                gain2.gain.setValueAtTime(0.3, ctx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
                osc2.start(ctx.currentTime);
                osc2.stop(ctx.currentTime + 0.6);
            }
        } catch (e) {
            console.warn('Audio error:', e);
        }
    }

    // ===== Map =====
    function initMap() {
        if (typeof L === 'undefined') {
            throw new Error('Leaflet nao carregou. Verifique sua conexao.');
        }

        map = L.map('map', {
            center: [CONFIG.center.lat, CONFIG.center.lon],
            zoom: 8,
            zoomControl: true
        });

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        boundsRect = L.rectangle(
            [[CONFIG.bounds.lamin, CONFIG.bounds.lomin], [CONFIG.bounds.lamax, CONFIG.bounds.lomax]],
            { color: '#38bdf8', weight: 1, opacity: 0.3, fill: false, dashArray: '5, 5' }
        ).addTo(map);

        routeLayer = L.layerGroup().addTo(map);

        // Force a resize after a short delay to ensure proper rendering
        setTimeout(function() {
            map.invalidateSize();
        }, 200);
    }

    function addAirports(airports) {
        if (!map || typeof L === 'undefined') return;
        airports.forEach(function(apt) {
            var marker = L.marker([apt.lat, apt.lon], {
                icon: L.divIcon({
                    className: 'airport-marker',
                    html: '<div class="airport-label">' + apt.icao + '</div>',
                    iconSize: [50, 16],
                    iconAnchor: [25, 8]
                }),
                zIndexOffset: -100
            }).addTo(map);
            marker.bindPopup('<b>' + apt.icao + '</b><br>' + apt.name);
            airportMarkers.push(marker);
        });
    }

    // ===== Aircraft Icon (helicóptero SVG vs avião) =====
    var ICON_BASE = '{{ url_for("static", filename="icons/") }}';
    function createAircraftIcon(heading, isTracked, onGround, model, isHelicopter) {
        var rotation = (heading != null) ? heading : 0;
        var size = isTracked ? 32 : 24;
        var opacity = isTracked ? 1.0 : 0.8;
        var helicopterIcon = (model === 'EC155' || model === 'EC135') ? model.toLowerCase() : null;
        var stroke = isTracked ? '#fff' : 'rgba(0,0,0,0.3)';
        var strokeW = isTracked ? 1.5 : 1;
        var color = isTracked ? (onGround ? '#f59e0b' : '#22c55e') : '#94a3b8';
        var html;
        if (helicopterIcon && isTracked) {
            var heliSrc = ICON_BASE + helicopterIcon + '.png';
            html = '<img src="' + heliSrc + '" width="' + size + '" height="' + size + '" ' +
                'style="transform:rotate(' + rotation + 'deg);opacity:' + opacity + ';object-fit:contain;filter:drop-shadow(0 0 3px rgba(255,255,255,0.5));" ' +
                'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'" />' +
                '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" style="display:none;transform:rotate(' + rotation + 'deg);opacity:' + opacity + ';">' +
                '<ellipse cx="12" cy="5" rx="8" ry="2" fill="' + color + '" stroke="' + stroke + '" stroke-width="' + strokeW + '"/>' +
                '<path d="M10 7 L14 7 L14 18 L10 18 Z" fill="' + color + '" stroke="' + stroke + '" stroke-width="' + strokeW + '"/>' +
                '<path d="M12 18 L12 21 M10 20 L14 20" stroke="' + stroke + '" stroke-width="' + strokeW + '" fill="none"/>' +
                '<circle cx="20" cy="12" r="1.5" fill="' + color + '" stroke="' + stroke + '"/></svg>';
        } else if (isHelicopter) {
            // Helicóptero genérico (SVG) para todos os helicópteros (cat 8)
            html = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" style="transform:rotate(' + rotation + 'deg);opacity:' + opacity + ';">' +
                '<ellipse cx="12" cy="5" rx="8" ry="2" fill="' + color + '" stroke="' + stroke + '" stroke-width="' + strokeW + '"/>' +
                '<path d="M10 7 L14 7 L14 18 L10 18 Z" fill="' + color + '" stroke="' + stroke + '" stroke-width="' + strokeW + '"/>' +
                '<path d="M12 18 L12 21 M10 20 L14 20" stroke="' + stroke + '" stroke-width="' + strokeW + '" fill="none"/>' +
                '<circle cx="20" cy="12" r="1.5" fill="' + color + '" stroke="' + stroke + '"/></svg>';
        } else {
            // Avião
            var aviaoSrc = ICON_BASE + 'aviao.png';
            html = '<img src="' + aviaoSrc + '" width="' + size + '" height="' + size + '" ' +
                'style="transform:rotate(' + rotation + 'deg);opacity:' + opacity + ';object-fit:contain;filter:drop-shadow(0 0 3px rgba(255,255,255,0.5));" ' +
                'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'" />' +
                '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" style="display:none;transform:rotate(' + rotation + 'deg);opacity:' + opacity + ';">' +
                '<path d="M12 2 L10 9 L3 12 L10 13 L10 20 L8 22 L12 21 L16 22 L14 20 L14 13 L21 12 L14 9 Z" fill="' + color + '"/>' +
                '</svg>';
        }
        return L.divIcon({
            className: 'aircraft-icon',
            html: html,
            iconSize: [size, size],
            iconAnchor: [size/2, size/2]
        });
    }

    // ===== Update Aircraft =====
    function updateAircraft(aircraftList) {
        if (!map || typeof L === 'undefined') return;
        var currentIcaos = {};

        for (var i = 0; i < aircraftList.length; i++) {
            var ac = aircraftList[i];
            if (!ac.latitude || !ac.longitude) continue;
            currentIcaos[ac.icao24] = true;

            var icon = createAircraftIcon(ac.heading, ac.is_tracked, ac.on_ground, ac.model, ac.is_helicopter);

            if (aircraftMarkers[ac.icao24]) {
                aircraftMarkers[ac.icao24].setLatLng([ac.latitude, ac.longitude]);
                aircraftMarkers[ac.icao24].setIcon(icon);
                aircraftMarkers[ac.icao24].setZIndexOffset(ac.is_tracked ? 1000 : 0);
            } else {
                var marker = L.marker([ac.latitude, ac.longitude], {
                    icon: icon,
                    zIndexOffset: ac.is_tracked ? 1000 : 0
                }).addTo(map);
                aircraftMarkers[ac.icao24] = marker;
            }

            aircraftMarkers[ac.icao24].bindPopup(buildPopup(ac));
        }

        // Remove stale markers
        var keys = Object.keys(aircraftMarkers);
        for (var j = 0; j < keys.length; j++) {
            if (!currentIcaos[keys[j]]) {
                map.removeLayer(aircraftMarkers[keys[j]]);
                delete aircraftMarkers[keys[j]];
            }
        }
    }

    var CATEGORY_LABELS = {
        2: 'Leve', 3: 'Pequeno', 4: 'Grande', 5: 'Alto vórtice', 6: 'Pesado',
        7: 'Alta performance', 8: 'Helicóptero', 9: 'Planador', 10: 'Mais leve que ar',
        11: 'Paraquedista', 12: 'Ultraleve', 14: 'VANT', 15: 'Espaço', 16: 'Emergência',
        17: 'Serviço'
    };
    function formatLastContact(ts) {
        if (ts == null) return '-';
        var sec = Math.floor(Date.now()/1000) - ts;
        if (sec < 5) return 'agora';
        if (sec < 60) return sec + ' s atrás';
        if (sec < 3600) return Math.floor(sec/60) + ' min atrás';
        return new Date(ts*1000).toLocaleTimeString('pt-BR');
    }
    function buildPopup(ac) {
        var tracked = ac.is_tracked ? '<div class="popup-tracked">RASTREADO</div>' : '';
        var reg = ac.registration || ac.callsign || ac.icao24;
        var alt = (ac.altitude_ft != null) ? ac.altitude_ft.toLocaleString() + ' ft' : '-';
        var spd = (ac.velocity_kt != null) ? ac.velocity_kt + ' kt' : '-';
        var hdg = (ac.heading != null) ? Math.round(ac.heading) + ' graus' : '-';
        var vr = '-';
        if (ac.vertical_rate != null) {
            var fpm = Math.round(ac.vertical_rate * 196.85);
            vr = (fpm > 0 ? '+' : '') + fpm + ' ft/min';
        }
        var statusTxt = ac.on_ground ? '<span style="color:#f59e0b">No solo</span>' : '<span style="color:#22c55e">Em voo</span>';
        var lastContact = formatLastContact(ac.last_contact);
        var squawk = (ac.squawk && ac.squawk !== '') ? ac.squawk : '-';
        var categoryTxt = (ac.category != null && CATEGORY_LABELS[ac.category]) ? CATEGORY_LABELS[ac.category] : '-';

        var html = '<div class="popup-reg">' + reg + '</div>' + tracked +
            '<div style="margin-top:6px;">' +
            '<span class="popup-field">ICAO24:</span> <span class="popup-value">' + ac.icao24 + '</span><br>' +
            '<span class="popup-field">Callsign:</span> <span class="popup-value">' + (ac.callsign || '-') + '</span><br>' +
            '<span class="popup-field">Status:</span> ' + statusTxt + '<br>' +
            '<span class="popup-field">Altitude:</span> <span class="popup-value">' + alt + '</span><br>' +
            '<span class="popup-field">Velocidade:</span> <span class="popup-value">' + spd + '</span><br>' +
            '<span class="popup-field">Proa:</span> <span class="popup-value">' + hdg + '</span><br>' +
            '<span class="popup-field">Razao Vertical:</span> <span class="popup-value">' + vr + '</span><br>' +
            '<span class="popup-field">Squawk:</span> <span class="popup-value">' + squawk + '</span><br>' +
            '<span class="popup-field">Categoria:</span> <span class="popup-value">' + categoryTxt + '</span><br>' +
            '<span class="popup-field">Último contato:</span> <span class="popup-value">' + lastContact + '</span><br>' +
            '<span class="popup-field">País:</span> <span class="popup-value">' + (ac.origin_country || '-') + '</span>' +
            '</div>';
        html += '<div id="popup-extra-' + ac.icao24 + '" class="popup-extra" style="margin-top:8px;padding-top:8px;border-top:1px solid #334155;"></div>';
        html += '<div style="margin-top:6px;"><a href="#" class="popup-more" data-icao="' + ac.icao24 + '">Carregar modelo/operador</a></div>';
        return html;
    }
    window._loadAircraftInfo = function(icao24) {
        var el = document.getElementById('popup-extra-' + icao24);
        var link = document.querySelector('[data-icao="' + icao24 + '"]');
        if (!el || !link) return;
        el.innerHTML = '<span class="popup-field">Carregando...</span>';
        link.style.display = 'none';
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/api/tracker/aircraft-info/' + icao24, true);
        xhr.onload = function() {
            if (xhr.status === 200) {
                try {
                    var d = JSON.parse(xhr.responseText);
                    if (d.error) { el.innerHTML = '<span class="popup-field">Indisponível</span>'; return; }
                    var parts = [];
                    if (d.type) parts.push('<span class="popup-field">Tipo:</span> ' + d.type);
                    if (d.manufacturer) parts.push('<span class="popup-field">Fabricante:</span> ' + d.manufacturer);
                    if (d.operator) parts.push('<span class="popup-field">Operador:</span> ' + d.operator);
                    if (d.country) parts.push('<span class="popup-field">País operador:</span> ' + d.country);
                    el.innerHTML = parts.length ? parts.join('<br>') : '<span class="popup-field">Sem dados adicionais</span>';
                } catch(e) { el.innerHTML = '<span class="popup-field">Erro ao carregar</span>'; }
            } else {
                el.innerHTML = '<span class="popup-field">Indisponível</span>';
            }
        };
        xhr.onerror = function() { el.innerHTML = '<span class="popup-field">Indisponível</span>'; };
        xhr.send();
    };
    document.addEventListener('click', function(e) {
        if (e.target && e.target.classList && e.target.classList.contains('popup-more')) {
            e.preventDefault();
            window._loadAircraftInfo(e.target.getAttribute('data-icao'));
        }
    });

    // ===== Tracked Panel =====
    function updateTrackedPanel(trackedData) {
        var container = document.getElementById('tracked-list');
        if (!trackedData || !container) return;

        var html = '';
        for (var i = 0; i < CONFIG.tracked_registrations.length; i++) {
            var reg = CONFIG.tracked_registrations[i];
            var inf = trackedData[reg] || { status: 'sem sinal', details: null };
            var statusClass = inf.status.replace(/ /g, '-');
            var regClass = (inf.status === 'sem sinal' || inf.status === 'sinal perdido') ? 'no-signal' : 'detected';

            var detailsHtml = '';
            var onclickAttr = '';
            if (inf.details) {
                var parts = [];
                if (inf.details.altitude_ft != null) parts.push('ALT: ' + inf.details.altitude_ft.toLocaleString() + ' ft');
                if (inf.details.velocity_kt != null) parts.push('VEL: ' + inf.details.velocity_kt + ' kt');
                if (inf.details.heading != null) parts.push('HDG: ' + Math.round(inf.details.heading) + ' graus');
                detailsHtml = '<div class="details">' + parts.join(' | ') + '</div>';
                onclickAttr = ' onclick="window._flyTo(' + inf.details.lat + ',' + inf.details.lon + ')"';
            }

            html += '<div class="tracked-item"' + onclickAttr + '>' +
                '<div class="reg ' + regClass + '">' + reg + '</div>' +
                '<div class="info ' + statusClass + '">' + inf.status.toUpperCase() + '</div>' +
                detailsHtml +
                '</div>';
        }
        container.innerHTML = html;
    }

    // Global flyTo function
    window._flyTo = function(lat, lon) {
        if (map && lat && lon) {
            map.flyTo([lat, lon], 12, { duration: 1 });
        }
    };

    // ===== Events =====
    var TYPE_LABELS = {
        'takeoff': 'DECOLAGEM',
        'landing': 'POUSO',
        'detected': 'DETECTADO',
        'lost_signal': 'SINAL PERDIDO'
    };

    function addEvents(newEvents) {
        if (!newEvents || newEvents.length === 0) return;

        for (var i = 0; i < newEvents.length; i++) {
            var evt = newEvents[i];
            eventsList.unshift(evt);
            playAlertSound(evt.type);
            showPopupNotification(evt);
            sendBrowserNotification(evt);
        }

        if (eventsList.length > 50) eventsList = eventsList.slice(0, 50);
        renderEvents();
    }

    function renderEvents() {
        var container = document.getElementById('events-list');
        if (!container) return;

        var eventFlightIds = {};
        for (var k = 0; k < eventsList.length; k++) {
            if (eventsList[k].flight_id) eventFlightIds[eventsList[k].flight_id] = true;
        }
        var merged = eventsList.slice();
        for (var h = 0; h < flightHistoryList.length; h++) {
            var f = flightHistoryList[h];
            if (f.id && !eventFlightIds[f.id]) {
                merged.push({
                    type: f.type || 'landing',
                    registration: f.registration || '',
                    time: f.time,
                    flight_id: f.id,
                    message: 'Clique para ver rota'
                });
                eventFlightIds[f.id] = true;
            }
        }
        merged.sort(function(a, b) {
            var ta = (a.time && new Date(a.time).getTime()) || 0;
            var tb = (b.time && new Date(b.time).getTime()) || 0;
            return tb - ta;
        });
        if (merged.length > 50) merged = merged.slice(0, 50);

        if (merged.length === 0) {
            container.innerHTML = '<div class="no-events">Aguardando eventos de aeronaves rastreadas...</div>';
            return;
        }

        var html = '';
        for (var i = 0; i < merged.length; i++) {
            var evt = merged[i];
            var timeStr = '--:--';
            if (evt.time) {
                try { timeStr = new Date(evt.time).toLocaleTimeString('pt-BR'); } catch(e) { timeStr = evt.time; }
            }
            var hasRoute = !!evt.flight_id;
            var cls = 'event-item ' + (evt.type || '') + (hasRoute ? ' has-route' : '');
            var onClick = hasRoute ? ' onclick="window._showRoute(\'' + evt.flight_id + '\')"' : '';
            html += '<div class="' + cls + '"' + onClick + '>' +
                '<div class="event-msg">' + (TYPE_LABELS[evt.type] || evt.type) + ' - ' + (evt.registration || '') + '</div>' +
                '<div class="event-time">' + timeStr + ' - ' + (evt.message || '') + '</div>' +
                (hasRoute ? '<div class="hint-route">Clique para ver rota no mapa</div>' : '') +
                '</div>';
        }
        container.innerHTML = html;
    }

    window._showRoute = function(flightId) {
        if (!flightId || !map || typeof L === 'undefined' || !routeLayer) return;
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/api/tracker/flight-route/' + encodeURIComponent(flightId), true);
        xhr.onload = function() {
            if (xhr.status !== 200) return;
            try {
                var data = JSON.parse(xhr.responseText);
                var route = data.route || [];
                if (route.length < 2) return;
                routeLayer.clearLayers();
                var latlngs = route.map(function(p) { return [p[0], p[1]]; });
                var polyline = L.polyline(latlngs, {
                    color: '#38bdf8',
                    weight: 4,
                    opacity: 0.9
                }).addTo(routeLayer);
                map.fitBounds(polyline.getBounds(), { padding: [40, 40], maxZoom: 12 });
            } catch(e) { console.warn('Route parse error', e); }
        };
        xhr.onerror = function() { console.warn('Route fetch failed'); };
        xhr.send();
    };

    function showPopupNotification(evt) {
        var container = document.getElementById('notification-popup');
        if (!container) return;

        var div = document.createElement('div');
        div.className = 'notif ' + (evt.type || '');
        div.innerHTML = '<div class="notif-title">' + (TYPE_LABELS[evt.type] || evt.type) + '</div>' +
            '<div class="notif-body">' + (evt.message || evt.registration || '') + '</div>';
        container.appendChild(div);

        setTimeout(function() {
            if (div.parentNode) div.parentNode.removeChild(div);
        }, 5500);
    }

    // ===== Browser Notifications =====
    window.requestNotifications = function() {
        if ('Notification' in window) {
            Notification.requestPermission().then(function(perm) {
                var btn = document.getElementById('btn-notif');
                if (perm === 'granted') {
                    btn.classList.add('active');
                    btn.textContent = 'Notif. ON';
                } else {
                    btn.textContent = 'Bloqueado';
                }
            });
        }
    };

    function sendBrowserNotification(evt) {
        if ('Notification' in window && Notification.permission === 'granted') {
            try {
                new Notification((TYPE_LABELS[evt.type] || '') + ' - ' + (evt.registration || ''), {
                    body: evt.message || '',
                    tag: 'tracker-' + evt.type + '-' + evt.registration
                });
            } catch(e) { /* ignore */ }
        }
    }

    // ===== Sound Toggle =====
    window.toggleSound = function() {
        soundEnabled = !soundEnabled;
        var btn = document.getElementById('btn-sound');
        if (soundEnabled) {
            btn.classList.add('active');
            btn.textContent = 'Som ON';
            getAudioCtx();
        } else {
            btn.classList.remove('active');
            btn.textContent = 'Som OFF';
        }
    };

    // ===== Data Fetching =====
    function fetchAircraft() {
        if (isLoading) return;
        isLoading = true;

        var dot = document.getElementById('status-dot');
        if (dot) dot.className = 'status-dot loading';

        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/api/tracker/aircraft', true);
        xhr.timeout = 20000;

        xhr.onload = function() {
            isLoading = false;
            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);

                    if (data.error) {
                        console.warn('API warning:', data.error);
                        if (dot) dot.className = 'status-dot offline';
                    } else {
                        if (dot) dot.className = 'status-dot online';
                    }

                    var countEl = document.getElementById('aircraft-count');
                    if (countEl) countEl.textContent = data.total || 0;

                    var timeEl = document.getElementById('last-update');
                    if (timeEl) timeEl.textContent = new Date().toLocaleTimeString('pt-BR');

                    if (data.aircraft) updateAircraft(data.aircraft);
                    if (data.tracked_aircraft) updateTrackedPanel(data.tracked_aircraft);
                    if (data.tracked_events && data.tracked_events.length > 0) addEvents(data.tracked_events);

                } catch(e) {
                    console.error('Parse error:', e);
                    if (dot) dot.className = 'status-dot offline';
                }
            } else {
                console.error('HTTP error:', xhr.status);
                if (dot) dot.className = 'status-dot offline';
            }
        };

        xhr.onerror = function() {
            isLoading = false;
            console.error('Network error');
            if (dot) dot.className = 'status-dot offline';
        };

        xhr.ontimeout = function() {
            isLoading = false;
            console.error('Request timeout');
            if (dot) dot.className = 'status-dot offline';
        };

        xhr.send();
    }

    function loadFlightHistory() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/api/tracker/flight-history', true);
        xhr.onload = function() {
            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    flightHistoryList = data.flights || [];
                    renderEvents();
                } catch(e) { console.warn('Flight history parse error', e); }
            }
        };
        xhr.onerror = function() {};
        xhr.send();
    }

    function loadConfig(callback) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/api/tracker/config', true);
        xhr.timeout = 10000;

        xhr.onload = function() {
            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    if (data.bounds) CONFIG.bounds = data.bounds;
                    if (data.center) CONFIG.center = data.center;
                    if (data.tracked_registrations) CONFIG.tracked_registrations = data.tracked_registrations;
                    if (data.airports) CONFIG.airports = data.airports;
                    if (data.refresh_interval) CONFIG.refresh_interval = data.refresh_interval;
                } catch(e) {
                    console.warn('Config parse error, using defaults');
                }
            }
            callback();
        };

        xhr.onerror = function() {
            console.warn('Config load error, using defaults');
            callback();
        };

        xhr.ontimeout = function() {
            console.warn('Config timeout, using defaults');
            callback();
        };

        xhr.send();
    }

    window.refreshNow = function() {
        if (refreshTimer) clearInterval(refreshTimer);
        fetchAircraft();
        refreshTimer = setInterval(fetchAircraft, CONFIG.refresh_interval * 1000);
    };

    // ===== Initialization =====
    function init() {
        var loadingStatus = document.getElementById('loading-status');

        try {
            if (loadingStatus) loadingStatus.textContent = 'Carregando configuracao...';

            loadConfig(function() {
                try {
                    if (loadingStatus) loadingStatus.textContent = 'Inicializando mapa...';

                    initMap();

                    if (CONFIG.airports && CONFIG.airports.length > 0) {
                        addAirports(CONFIG.airports);
                    }

                    if (boundsRect) {
                        boundsRect.setBounds([
                            [CONFIG.bounds.lamin, CONFIG.bounds.lomin],
                            [CONFIG.bounds.lamax, CONFIG.bounds.lomax]
                        ]);
                    }

                    hideLoading();

                    if (loadingStatus) loadingStatus.textContent = 'Buscando aeronaves...';

                    loadFlightHistory();
                    fetchAircraft();
                    refreshTimer = setInterval(fetchAircraft, CONFIG.refresh_interval * 1000);
                    setInterval(loadFlightHistory, 120000);

                    if ('Notification' in window && Notification.permission === 'granted') {
                        var btn = document.getElementById('btn-notif');
                        if (btn) {
                            btn.classList.add('active');
                            btn.textContent = 'Notif. ON';
                        }
                    }

                } catch(e) {
                    console.error('Init error:', e);
                    showError('Erro ao inicializar: ' + e.message);
                }
            });

        } catch(e) {
            console.error('Startup error:', e);
            showError('Erro ao iniciar: ' + e.message);
        }
    }

    // Wait for DOM and then start
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            // Extra delay to ensure Leaflet is parsed
            setTimeout(init, 100);
        });
    } else {
        setTimeout(init, 100);
    }

})();
</script>

</body>
</html>
