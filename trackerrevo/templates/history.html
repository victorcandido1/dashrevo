<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Voos - Radar REVO</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet.css') }}" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e17;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 48px;
            background: rgba(10, 14, 23, 0.95);
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
        }

        #topbar .title { font-size: 16px; font-weight: 700; color: #38bdf8; }
        .nav-link {
            color: #64748b;
            text-decoration: none;
            font-size: 12px;
        }
        .nav-link:hover { color: #94a3b8; }

        #map {
            position: fixed;
            top: 48px; left: 0; right: 300px; bottom: 0;
            z-index: 1;
            background: #0a0e17;
        }

        #history-panel {
            position: fixed;
            top: 48px; right: 0;
            width: 300px;
            height: calc(100vh - 48px);
            background: rgba(15, 23, 42, 0.98);
            border-left: 1px solid #1e293b;
            overflow-y: auto;
            z-index: 500;
        }

        .panel-header {
            padding: 12px 16px;
            font-size: 12px;
            font-weight: 700;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #1e293b;
        }

        .flight-item {
            padding: 12px 16px;
            border-bottom: 1px solid #1e293b;
            cursor: pointer;
            transition: background 0.2s;
        }
        .flight-item:hover { background: rgba(56, 189, 248, 0.08); }
        .flight-item.selected {
            background: rgba(56, 189, 248, 0.15);
            border-left: 3px solid #38bdf8;
        }

        .flight-item .reg { font-weight: 700; color: #e2e8f0; }
        .flight-item .type { font-size: 11px; color: #94a3b8; text-transform: uppercase; }
        .flight-item .time { font-size: 11px; color: #64748b; }
        .flight-item .route { font-size: 11px; color: #38bdf8; margin-top: 4px; }

        .no-flights {
            padding: 24px 16px;
            color: #64748b;
            font-size: 13px;
        }

        .loading-msg { padding: 16px; color: #64748b; font-size: 12px; }

        @media (max-width: 768px) {
            #map { right: 0; }
            #history-panel { width: 100%; max-height: 40vh; top: auto; bottom: 0; }
        }
    </style>
</head>
<body>

<div id="topbar">
    <div>
        <a href="/" class="nav-link">&larr; Radar</a>
        <span style="margin: 0 8px; color: #334155;">|</span>
        <span class="title">HISTÓRICO DE VOOS</span>
    </div>
</div>

<div id="map"></div>

<div id="history-panel">
    <div class="panel-header">Voos rastreados</div>
    <div id="flights-list">
        <div class="loading-msg">Carregando histórico...</div>
    </div>
</div>

<script src="{{ url_for('static', filename='vendor/leaflet.js') }}"></script>
<script>
(function() {
    'use strict';
    var map = null;
    var routeLayer = null;
    var selectedId = null;

    function initMap() {
        map = L.map('map', {
            center: [-23.55, -46.63],
            zoom: 8
        });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);
        routeLayer = L.layerGroup().addTo(map);
    }

    function showRoute(flightId) {
        if (!flightId || !map || !routeLayer) return;
        selectedId = flightId;
        var items = document.querySelectorAll('.flight-item');
        for (var i = 0; i < items.length; i++) {
            items[i].classList.toggle('selected', items[i].dataset.id === flightId);
        }
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/api/tracker/flight-route/' + encodeURIComponent(flightId), true);
        xhr.onload = function() {
            if (xhr.status !== 200) return;
            try {
                var data = JSON.parse(xhr.responseText);
                var route = data.route || [];
                routeLayer.clearLayers();
                if (route.length < 2) return;
                var latlngs = route.map(function(p) { return [p[0], p[1]]; });
                var polyline = L.polyline(latlngs, {
                    color: '#38bdf8',
                    weight: 4,
                    opacity: 0.9
                }).addTo(routeLayer);
                map.fitBounds(polyline.getBounds(), { padding: [40, 40], maxZoom: 12 });
            } catch(e) { console.warn('Route parse error', e); }
        };
        xhr.onerror = function() { console.warn('Route fetch failed'); };
        xhr.send();
    }

    window._showRoute = showRoute;

    function loadFlights() {
        var list = document.getElementById('flights-list');
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/api/tracker/flight-history', true);
        xhr.onload = function() {
            if (xhr.status !== 200) {
                list.innerHTML = '<div class="no-flights">Erro ao carregar histórico.</div>';
                return;
            }
            try {
                var data = JSON.parse(xhr.responseText);
                var flights = data.flights || [];
                if (flights.length === 0) {
                    list.innerHTML = '<div class="no-flights">Nenhum voo registrado ainda.<br><br>Os voos são salvos automaticamente ao detectar pouso no radar.</div>';
                    return;
                }
                var html = '';
                var TYPE_LABELS = { 'landing': 'Pouso', 'takeoff': 'Decolagem' };
                for (var i = 0; i < flights.length; i++) {
                    var f = flights[i];
                    var typeLabel = TYPE_LABELS[f.type] || f.type || 'Voo';
                    var timeStr = f.time ? (f.time.length > 19 ? f.time.substring(0, 19) : f.time).replace('T', ' ') : '--:--';
                    var routeInfo = '';
                    if (f.origin_icao || f.destination_icao) {
                        routeInfo = (f.origin_icao || '?') + ' → ' + (f.destination_icao || '?');
                    } else {
                        routeInfo = 'Clique para ver rota';
                    }
                    html += '<div class="flight-item" data-id="' + (f.id || '') + '" onclick="window._showRoute(\'' + (f.id || '') + '\')">' +
                        '<div class="reg">' + (f.registration || '-') + '</div>' +
                        '<div class="type">' + typeLabel + '</div>' +
                        '<div class="time">' + timeStr + '</div>' +
                        '<div class="route">' + routeInfo + '</div>' +
                        '</div>';
                }
                list.innerHTML = html;
            } catch(e) {
                list.innerHTML = '<div class="no-flights">Erro ao processar dados.</div>';
            }
        };
        xhr.onerror = function() {
            list.innerHTML = '<div class="no-flights">Erro de conexão.</div>';
        };
        xhr.send();
    }

    function init() {
        initMap();
        loadFlights();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() { setTimeout(init, 100); });
    } else {
        setTimeout(init, 100);
    }
})();
</script>
</body>
</html>
